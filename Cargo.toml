[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/mcp",
]

# The release profile was whatever cargo's default is, which for a binary this wide
# means 16 codegen units per crate and no cross-crate inlining: 27 MB of `.text`, of
# which the running app keeps ~24 MB resident. `lto` and a single codegen unit let the
# generics that repeat across crates collapse into one copy each, which is the only
# part of a GPU app's footprint the app itself controls -- the other ~150 MB is the
# display driver's shared library text. Measured below, in PROJECT.md.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Dual MIT OR Apache-2.0, the same pairing Rust itself uses, so anything that can
# consume Rust code can consume this. It also stays compatible with everything the
# binary carries: gpui (Apache-2.0), rusqlite (MIT/Unlicense), petgraph, pulldown-cmark
# and similar (MIT). The texts are the canonical ones — LICENSE-APACHE is byte-identical
# to rust-lang/rust's, and LICENSE-MIT is the SPDX MIT text with the holder line set to
# "The Shale Contributors", the collective form Rust uses for its own.

[workspace.dependencies]
anyhow = "1"
# Zed's gpui as shipped in Zed 1.25.3. crates.io's gpui 0.2.2 is an older tree
# whose Wayland backend stalls its frame/present loop (blank window on niri);
# this tag has the rewritten frame-loop in gpui_linux. Apache-2.0.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.25.3" }
gpui_platform = {
    git = "https://github.com/zed-industries/zed",
    tag = "v1.25.3",
    features = ["wayland", "x11", "font-kit"],
}
pulldown-cmark = "0.13"
# The vault index (roadmap P1.1). `bundled` compiles SQLite from source, so the
# binary carries no system sqlite dependency and every platform gets the same
# version. MIT / Unlicense. Ruled in by the user: the one external binding allowed.
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
# The graph's adjacency structure (graph-view-plan.md). MIT, pure Rust.
petgraph = "0.8"
# The line-level diff behind agent edit review (roadmap P2.5a, reused by P4.2).
# MIT, pure Rust, no bindings — ruled in by the user 2026-11-01: a small pure-Rust
# crate is fine where the no-bindings rule still stands.
similar = "2"
# Streams and channels for the language-server client: the reader thread hands
# messages to a gpui task. Already in the tree through gpui, so no new download.
# MIT / Apache-2.0.
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shale-core = { path = "crates/core" }
toml = "0.9"
