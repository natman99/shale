[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shale-core = { path = "crates/core" }
toml = "0.9"
