[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shale-core = { path = "crates/core" }
toml = "0.9"

# xattr 0.2.3 (pulled in by gpui_http_client -> zed-async-tar) fails to build
# on glibc because libc no longer exposes ENOATTR on Linux. Vendored patched
# copy defines it as 61 (ENODATA). See vendor/xattr/PATCH.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
