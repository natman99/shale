# Shale reads this file when it opens the vault. Every key is optional; what is
# here is the default settings, written out so you can see what exists.

[editor]
vim_mode = true
line_wrap = true
show_file_tree = true

[appearance]
# The palette: a built-in ("dark", "light", or a Catppuccin flavour - "latte",
# "frappe", "macchiato", "mocha", also spelled "catppuccin-mocha"), or the name
# of a file in .shale/themes/<name>.toml. The default is "mocha". A theme file
# starts from one of the built-ins (`base = "light"`) and overrides only the
# colours it cares about, by role:
#
#   base = "dark"
#   bg = "#282828"
#   fg = "#ebdbb2"
#   link = "#83a598"
#
# The full list of role names is the field list of `shale_core::theme::Palette`.
theme = "mocha"
# Body text size in points; headings and line heights are scaled from it.
font_size = 14.0
# Empty means "pick a monospace family that is actually installed".
font_family = ""
# Hide the markdown syntax of a row the cursor is not on.
live_preview = true
