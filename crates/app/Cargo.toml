[package]
name = "shale-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shale"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# The window icon is an `image::RgbaImage` (`identity.rs`), which is the type gpui's
# `WindowOptions::icon` asks for — and every window asks for it (`vaults.rs`), on every
# platform, so this sits in the common dependencies rather than the Windows ones.
# `image` is already compiled into the binary through gpui, so this names a crate the
# build already has rather than adding one.
image = { version = "0.25", default-features = false }
# The graph's links are tessellated by hand (see `graph::render`), which means filling the
# same vertex buffer gpui's own tessellators fill. lyon is already compiled into the binary
# through gpui, so this names a crate the build already has rather than adding one.
lyon = "1.0"
serde_json.workspace = true
shale-core.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Signals are a unix thing, and so are the two crates that raise them;
# `main` installs them behind the same gate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1"

# The desktop's dark-or-light setting (`desktop.rs`, `design-language.md` §15).
# `ashpd` is the XDG Desktop Portal client gpui's Linux backend already links --
# the same version and the same features it asks for -- so this names a crate
# the build already has rather than adding one.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "settings",
] }

# Windows has no `flock`; the vault claim (`vaults.rs`) uses `LockFileEx`,
# the byte-range lock the kernel drops with the handle, however the process
# dies — the same guarantee the unix claim gives. `windows-sys` is already in
# the tree through gpui; this names the same version, not a new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
