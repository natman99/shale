[package]
name = "shale-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shale"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
gpui = "0.2.2"
shale-core.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
